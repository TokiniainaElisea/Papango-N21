<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papango N21 — Chargement</title>

    <link href="css/bootstrap.css" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        /* FOND DÉGRADÉ ANIMÉ */
        .splash {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0d1117 0%, #1a2332 40%, #0d6efd 130%);
            background-size: 200% 200%;
            animation: gradientShift 8s ease infinite;
            color: white;
            z-index: 9999;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* HALO LUMINEUX */
        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(13, 110, 253, 0.4) 0%, transparent 70%);
            filter: blur(60px);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1);   opacity: 0.6; }
            50%      { transform: scale(1.1); opacity: 0.9; }
        }

        /* LOGO */
        .logo-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 140px;
            height: 140px;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow:
                0 20px 60px rgba(13, 110, 253, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            margin-bottom: 32px;
            animation: logoEnter 1s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }

        .logo-wrapper i {
            font-size: 72px;
            color: white;
            filter: drop-shadow(0 0 20px rgba(13, 110, 253, 0.8));
        }

        @keyframes logoEnter {
            0%   { opacity: 0; transform: scale(0.5) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* NOM DE L'APP */
        .app-name {
            position: relative;
            z-index: 2;
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 0%, #a5c9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeUp 0.8s ease 0.3s both;
        }

        .app-version {
            position: relative;
            z-index: 2;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 60px;
            animation: fadeUp 0.8s ease 0.5s both;
        }

        /* BARRE DE PROGRESSION */
        .progress-wrapper {
            position: relative;
            z-index: 2;
            width: 280px;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 20px;
            animation: fadeUp 0.8s ease 0.7s both;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0d6efd, #4da3ff, #0d6efd);
            background-size: 200% 100%;
            border-radius: 999px;
            box-shadow: 0 0 20px rgba(13, 110, 253, 0.8);
            animation:
                loadProgress 2.8s cubic-bezier(0.4, 0, 0.2, 1) forwards,
                shimmer 2s linear infinite;
        }

        @keyframes loadProgress {
            0%   { width: 0%; }
            30%  { width: 40%; }
            60%  { width: 70%; }
            100% { width: 100%; }
        }

        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* TEXTE DE CHARGEMENT */
        .loading-text {
            position: relative;
            z-index: 2;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            animation: fadeUp 0.8s ease 0.9s both;
        }

        .loading-text .dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        /* PIED DE PAGE */
        .splash-footer {
            position: absolute;
            bottom: 30px;
            z-index: 2;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
            animation: fadeUp 0.8s ease 1.1s both;
        }

        @keyframes fadeUp {
            0%   { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* SORTIE DU SPLASH */
        .splash.fade-out {
            animation: fadeOut 0.6s ease forwards;
        }

        @keyframes fadeOut {
            0%   { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.05); pointer-events: none; }
        }

        /* PARTICULES */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            pointer-events: none;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0%   { transform: translateY(0) scale(1); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="splash" id="splash">

        <!-- Halo lumineux -->
        <div class="glow"></div>

        <!-- Logo -->
        <div class="logo-wrapper">
            <img src="icon.png" alt="icon papango N21" style="width: 135px; height:auto;">
        </div>

        <!-- Nom + version -->
        <h1 class="app-name">Papango N21</h1>
        <div class="app-version">Version 1.0.0</div>

        <!-- Barre de progression -->
        <div class="progress-wrapper">
            <div class="progress-bar"></div>
        </div>

        <!-- Texte de chargement -->
        <div class="loading-text">
            Chargement<span class="dots"></span>
        </div>

        <!-- Pied de page -->
        <div class="splash-footer">
            Développé par Tokiniaina
        </div>

    </div>

    <script>
        // GÉNÉRATION DES PARTICULES DÉCORATIVES
        (function generateParticles() {
            const splash = document.getElementById('splash');
            const count = 25;

            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';

                const size = Math.random() * 3 + 1;
                const left = Math.random() * 100;
                const duration = Math.random() * 8 + 6;
                const delay = Math.random() * 5;

                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.left = left + '%';
                p.style.bottom = '-10px';
                p.style.animationDuration = duration + 's';
                p.style.animationDelay = delay + 's';

                splash.appendChild(p);
            }
        })();

        // REDIRECTION APRÈS LE CHARGEMENT
        window.addEventListener('DOMContentLoaded', () => {
            const SPLASH_DURATION = 3200;

            setTimeout(() => {
                const splash = document.getElementById('splash');
                splash.classList.add('fade-out');

                setTimeout(() => {
                    window.location.href = '/';
                }, 600);
            }, SPLASH_DURATION);
        });
    </script>

</body>
</html>
